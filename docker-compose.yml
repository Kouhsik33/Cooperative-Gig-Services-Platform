# Per Part K: Postgres (PostGIS enabled) + backend + ai-service are
# containerized here. Mobile app runs via `expo start` (mobile-app/),
# admin-web runs via `npm run dev` (admin-web/) — not containerized.

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sih26089
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sih26089?schema=public
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - ai-service

  ai-service:
    build:
      context: ./ai-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sih26089?schema=public
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data:
