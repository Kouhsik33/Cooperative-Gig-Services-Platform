<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="830"
     viewBox="0 0 1600 830" role="img" aria-label="Two-sided transparency — one number, both sides">
<title>Two-sided transparency — one number, both sides</title>
<defs>
  <style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');]]></style>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#6B7C76"/>
  </marker>
  <marker id="ar-p" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#0F6B5C"/>
  </marker>
</defs>
<rect width="1600" height="830" fill="#F7F8F6"/>

<text x="70" y="74" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6B7C76" text-anchor="start" letter-spacing="1.1">SLIDE 2 · TWO-SIDED TRANSPARENCY</text>
<text x="70" y="104" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#16211E" text-anchor="start">The customer and the worker see the same number, before either commits</text>
<rect x="150" y="190" width="400" height="520" rx="24" fill="#FFFFFF" stroke="#D8E0DB" stroke-width="2"/>
<line x1="316.0" y1="212" x2="384.0" y2="212" stroke="#D8E0DB" stroke-width="5" stroke-linecap="round"/>
<text x="180" y="264" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2F6FB0" text-anchor="start" letter-spacing="1.1">CUSTOMER APP</text>
<text x="180" y="302" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#16211E" text-anchor="start">Fair Pricing Breakdown</text>
<text x="180" y="348" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6B65" text-anchor="start">Total price</text>
<text x="520" y="348" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#16211E" text-anchor="end">₹899.00</text>
<text x="180" y="378" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6B65" text-anchor="start">Federation fee</text>
<text x="520" y="378" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#16211E" text-anchor="end">₹89.90</text>
<text x="180" y="408" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6B65" text-anchor="start">Welfare contribution</text>
<text x="520" y="408" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#16211E" text-anchor="end">₹26.97</text>
<line x1="180" y1="444" x2="520" y2="444" stroke="#D8E0DB" stroke-width="1.5" stroke-linecap="round"/>
<text x="180" y="478" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#5B6B65" text-anchor="start" letter-spacing="1.1"></text>
<text x="180" y="484" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#5B6B65" text-anchor="start" letter-spacing="1.1">WORKER'S SHARE</text>
<text x="180" y="534" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#2F6FB0" text-anchor="start">₹782.13</text>
<rect x="180" y="632" width="340" height="50" rx="8" fill="#2F6FB0"/>
<text x="350.0" y="664" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Confirm booking</text>
<rect x="1050" y="190" width="400" height="520" rx="24" fill="#FFFFFF" stroke="#D8E0DB" stroke-width="2"/>
<line x1="1216.0" y1="212" x2="1284.0" y2="212" stroke="#D8E0DB" stroke-width="5" stroke-linecap="round"/>
<text x="1080" y="264" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#0F6B5C" text-anchor="start" letter-spacing="1.1">WORKER APP</text>
<text x="1080" y="302" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#16211E" text-anchor="start">New service request</text>
<text x="1080" y="348" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6B65" text-anchor="start">AC Servicing · Standard</text>
<text x="1420" y="348" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#16211E" text-anchor="end"></text>
<text x="1080" y="378" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6B65" text-anchor="start">2.4 km away</text>
<text x="1420" y="378" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#16211E" text-anchor="end"></text>
<text x="1080" y="408" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6B65" text-anchor="start">Est. 60–90 min</text>
<text x="1420" y="408" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#16211E" text-anchor="end"></text>
<line x1="1080" y1="444" x2="1420" y2="444" stroke="#D8E0DB" stroke-width="1.5" stroke-linecap="round"/>
<text x="1080" y="478" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#5B6B65" text-anchor="start" letter-spacing="1.1"></text>
<text x="1080" y="484" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#5B6B65" text-anchor="start" letter-spacing="1.1">EXPECTED EARNINGS</text>
<text x="1080" y="534" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#0F6B5C" text-anchor="start">₹782.13</text>
<rect x="1080" y="632" width="340" height="50" rx="8" fill="#0F6B5C"/>
<text x="1250.0" y="664" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Accept</text>
<line x1="570" y1="450.0" x2="670.0" y2="450.0" stroke="#0F6B5C" stroke-width="2" stroke-linecap="round"/>
<line x1="930.0" y1="450.0" x2="1030" y2="450.0" stroke="#0F6B5C" stroke-width="2" stroke-linecap="round"/>
<rect x="670.0" y="396.0" width="260" height="108" rx="12" fill="#E1F0EB" stroke="#0F6B5C" stroke-width="3"/>
<text x="800.0" y="432.0" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0F6B5C" text-anchor="middle" letter-spacing="1.6">ONE</text>
<text x="800.0" y="456.0" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0F6B5C" text-anchor="middle" letter-spacing="1.6">SERVER-SIDE</text>
<text x="800.0" y="480.0" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0F6B5C" text-anchor="middle" letter-spacing="1.6">CALCULATION</text>
<text x="70" y="762" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#16211E" text-anchor="start">On a conventional gig platform neither screen exists: the customer sees a price, the worker sees a payout, and nobody sees both.</text>
<text x="70" y="792" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="10" font-weight="400" fill="#5B6B65" text-anchor="start">UI reconstruction from the app's own design tokens and real i18n strings (fairPricing.workerShare · workerHome.expectedEarnings); amount is the live API value.</text>
</svg>
