<text x="96" y="682" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="14" font-weight="700" fill="#6B7C76" text-anchor="start">federationFee</text>
<text x="300" y="682" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="14" font-weight="400" fill="#5B6B65" text-anchor="start">= basePrice × 10%</text>
<text x="1504" y="682" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="14" font-weight="700" fill="#6B7C76" text-anchor="end">₹89.90</text>
<text x="96" y="708" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="14" font-weight="700" fill="#0A4F44" text-anchor="start">welfareContribution</text>
<text x="300" y="708" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="14" font-weight="400" fill="#5B6B65" text-anchor="start">= basePrice × 3%</text>
<text x="1504" y="708" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="14" font-weight="700" fill="#0A4F44" text-anchor="end">₹26.97</text>
<text x="96" y="734" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="14" font-weight="700" fill="#0F6B5C" text-anchor="start">workerShare</text>
<text x="300" y="734" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="14" font-weight="400" fill="#5B6B65" text-anchor="start">= totalAmount − federationFee − welfareContribution</text>
<text x="1504" y="734" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="14" font-weight="700" fill="#0F6B5C" text-anchor="end">₹782.13 · ₹961.93</text>
<text x="96" y="782" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#16211E" text-anchor="start">Fee and welfare are computed from basePrice; the worker's share is computed from totalAmount. The surge is arithmetically unreachable by the federation.</text>
