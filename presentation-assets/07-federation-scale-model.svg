<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760"
     viewBox="0 0 1600 760" role="img" aria-label="Federation scale model — rollout rides existing institutions">
<title>Federation scale model — rollout rides existing institutions</title>
<defs>
  <style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');]]></style>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#6B7C76"/>
  </marker>
  <marker id="ar-p" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#0F6B5C"/>
  </marker>
</defs>
<rect width="1600" height="760" fill="#F7F8F6"/>

<text x="70" y="74" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6B7C76" text-anchor="start" letter-spacing="1.1">SLIDE 3 · OPERATING MODEL</text>
<text x="70" y="104" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#16211E" text-anchor="start">The rollout channel already exists</text>
<rect x="70" y="170" width="780" height="76" rx="10" fill="#EDF1EE"/>
<rect x="70" y="170" width="6" height="76" rx="3" fill="#0A4F44"/>
<text x="100" y="202" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0A4F44" text-anchor="start">Federation</text>
<text x="100" y="226" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="10" font-weight="400" fill="#5B6B65" text-anchor="start">registered cooperative apex body</text>
<text x="826" y="214" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0A4F44" text-anchor="end" letter-spacing="1.3">ALREADY EXISTS</text>
<rect x="70" y="260" width="780" height="76" rx="10" fill="#EDF1EE"/>
<rect x="70" y="260" width="6" height="76" rx="3" fill="#0A4F44"/>
<text x="100" y="292" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0A4F44" text-anchor="start">Societies</text>
<text x="100" y="316" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="10" font-weight="400" fill="#5B6B65" text-anchor="start">local units with member registries</text>
<text x="826" y="304" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0A4F44" text-anchor="end" letter-spacing="1.3">ALREADY EXISTS</text>
<rect x="70" y="350" width="780" height="76" rx="10" fill="#EDF1EE"/>
<rect x="70" y="350" width="6" height="76" rx="3" fill="#0A4F44"/>
<text x="100" y="382" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0A4F44" text-anchor="start">Verified workers</text>
<text x="100" y="406" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="10" font-weight="400" fill="#5B6B65" text-anchor="start">admitted and skill-profiled members</text>
<text x="826" y="394" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0A4F44" text-anchor="end" letter-spacing="1.3">ALREADY EXISTS</text>
<rect x="70" y="440" width="780" height="76" rx="10" fill="#FFFFFF" stroke="#D8E0DB" stroke-width="1.5"/>
<text x="100" y="472" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#5B6B65" text-anchor="start">Local service zones</text>
<text x="100" y="496" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="10" font-weight="400" fill="#5B6B65" text-anchor="start">pincode coverage</text>
<rect x="70" y="530" width="780" height="76" rx="10" fill="#FFFFFF" stroke="#D8E0DB" stroke-width="1.5"/>
<text x="100" y="562" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#5B6B65" text-anchor="start">Customers</text>
<text x="100" y="586" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="10" font-weight="400" fill="#5B6B65" text-anchor="start">households and institutions</text>
<path d="M 910 174 H 890 V 422 H 910" fill="none" stroke="#0A4F44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="934" y="226" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0A4F44" text-anchor="start">Three of five layers</text>
<text x="934" y="254" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0A4F44" text-anchor="start">are pre-existing institutions.</text>
<text x="934" y="290" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6B65" text-anchor="start">Member registries, verification and local</text>
<text x="934" y="312" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6B65" text-anchor="start">governance are already in place — there is</text>
<text x="934" y="334" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6B65" text-anchor="start">no marketplace cold start to solve.</text>
<rect x="934" y="360" width="520" height="60" rx="10" fill="#FAEDE1" stroke="#C0651F" stroke-width="2"/>
<text x="956" y="398" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#C0651F" text-anchor="start">Adoption is not a customer-acquisition problem.</text>
<text x="70" y="642" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6B7C76" text-anchor="start" letter-spacing="1.1">EXPANSION PATH</text>
<rect x="70" y="660" width="210" height="56" rx="8" fill="#0A4F44" stroke="#0A4F44" stroke-width="2"/>
<text x="175.0" y="692.9" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">1 federation</text>
<path d="M 288 688 H 310" fill="none" stroke="#6B7C76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="318" y="660" width="210" height="56" rx="8" fill="#FFFFFF" stroke="#6B7C76" stroke-width="1.5"/>
<text x="423.0" y="692.9" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7C76" text-anchor="middle">n societies</text>
<path d="M 536 688 H 558" fill="none" stroke="#6B7C76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="566" y="660" width="210" height="56" rx="8" fill="#FFFFFF" stroke="#6B7C76" stroke-width="1.5"/>
<text x="671.0" y="692.9" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7C76" text-anchor="middle">n districts</text>
<path d="M 784 688 H 806" fill="none" stroke="#6B7C76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="814" y="660" width="210" height="56" rx="8" fill="#FFFFFF" stroke="#6B7C76" stroke-width="1.5"/>
<text x="919.0" y="692.9" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7C76" text-anchor="middle">n states</text>
<text x="1068" y="694" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="10" font-weight="400" fill="#5B6B65" text-anchor="start">Per-federation tenancy is already in the schema.</text>
</svg>
