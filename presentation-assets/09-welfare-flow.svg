<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560"
     viewBox="0 0 1600 560" role="img" aria-label="Welfare — a ledger, not a promise">
<title>Welfare — a ledger, not a promise</title>
<defs>
  <style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');]]></style>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#6B7C76"/>
  </marker>
  <marker id="ar-p" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#0F6B5C"/>
  </marker>
</defs>
<rect width="1600" height="560" fill="#F7F8F6"/>

<text x="70" y="66" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6B7C76" text-anchor="start" letter-spacing="1.1">SLIDE 4 · WORKER WELFARE</text>
<text x="70" y="96" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#16211E" text-anchor="start">3% of every completed booking, with an auditable trail</text>
<rect x="70" y="190" width="268" height="96" rx="8" fill="#FFFFFF" stroke="#0F6B5C" stroke-width="2"/>
<text x="204.0" y="234.15" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0A4F44" text-anchor="middle">Service</text>
<text x="204.0" y="251.65" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0A4F44" text-anchor="middle">completed</text>
<path d="M 346 238 H 364" fill="none" stroke="#6B7C76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="372" y="190" width="268" height="96" rx="8" fill="#FAEDE1" stroke="#C0651F" stroke-width="2"/>
<text x="506.0" y="234.15" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#C0651F" text-anchor="middle">OTP verified</text>
<text x="506.0" y="251.65" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#C0651F" text-anchor="middle">by customer</text>
<path d="M 648 238 H 666" fill="none" stroke="#6B7C76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="674" y="190" width="268" height="96" rx="8" fill="#0A4F44" stroke="#0A4F44" stroke-width="2"/>
<text x="808.0" y="234.15" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">3% credited</text>
<text x="808.0" y="251.65" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">in one transaction</text>
<path d="M 950 238 H 968" fill="none" stroke="#6B7C76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="976" y="190" width="268" height="96" rx="8" fill="#0A4F44" stroke="#0A4F44" stroke-width="2"/>
<text x="1110.0" y="234.15" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Welfare ledger</text>
<text x="1110.0" y="251.65" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">135 entries</text>
<path d="M 1252 238 H 1270" fill="none" stroke="#6B7C76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="1278" y="190" width="268" height="96" rx="8" fill="#FFFFFF" stroke="#0F6B5C" stroke-width="2"/>
<text x="1412.0" y="234.15" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0A4F44" text-anchor="middle">Worker benefit</text>
<text x="1412.0" y="251.65" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0A4F44" text-anchor="middle">insurance · support</text>
<rect x="70" y="336" width="700" height="96" rx="12" fill="#E1F0EB" stroke="#0F6B5C" stroke-width="2"/>
<text x="96" y="376" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0F6B5C" text-anchor="start">₹1,914</text>
<text x="240" y="370" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#16211E" text-anchor="start">accrued across 135 ledger entries</text>
<text x="240" y="394" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="10" font-weight="400" fill="#5B6B65" text-anchor="start">on the seeded prototype dataset</text>
<rect x="800" y="336" width="730" height="96" rx="12" fill="#FFFFFF" stroke="#D8E0DB" stroke-width="1.5"/>
<text x="826" y="370" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#16211E" text-anchor="start">Credited only when the booking is paid.</text>
<text x="826" y="394" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="10" font-weight="400" fill="#5B6B65" text-anchor="start">Completing an unpaid job does not credit money never collected.</text>
<text x="70" y="500" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="10" font-weight="400" fill="#5B6B65" text-anchor="start">Requirement 7 · WelfareFundTransaction + WelfareFund.balance, incremented inside the same transaction that marks the booking COMPLETED.</text>
</svg>
