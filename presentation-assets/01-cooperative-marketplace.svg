<text x="1240" y="200" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#0F6B5C" text-anchor="start" letter-spacing="1.1">21 VERIFIED WORKERS · 3 SOCIETIES</text>
<rect x="70" y="630" width="1460" height="92" rx="12" fill="#FAEDE1" stroke="#C0651F" stroke-width="2"/>
<text x="96" y="670" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#C0651F" text-anchor="start">The supply network is not built per booking — it is the cooperative.</text>
<text x="96" y="698" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6B65" text-anchor="start">Federations and societies already hold member registries, verification and local governance. There is no marketplace cold start to solve.</text>
<text x="70" y="766" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="10" font-weight="400" fill="#5B6B65" text-anchor="start">Federation · Society · Worker counts are live values from the seeded demo database.</text>
