<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="790"
     viewBox="0 0 1600 790" role="img" aria-label="Cooperative marketplace — demand meets an existing supply network">
<title>Cooperative marketplace — demand meets an existing supply network</title>
<defs>
  <style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');]]></style>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#6B7C76"/>
  </marker>
  <marker id="ar-p" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#0F6B5C"/>
  </marker>
</defs>
<rect width="1600" height="790" fill="#F7F8F6"/>

<text x="70" y="74" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6B7C76" text-anchor="start" letter-spacing="1.1">SLIDE 1 · WHAT WE BUILT</text>
<text x="70" y="104" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#16211E" text-anchor="start">A marketplace whose supply network already exists</text>
<text x="70" y="178" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2F6FB0" text-anchor="start" letter-spacing="1.1">DEMAND</text>
<rect x="70" y="200" width="250" height="74" rx="8" fill="#FFFFFF" stroke="#2F6FB0" stroke-width="2"/>
<text x="195.0" y="244.0" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#2F6FB0" text-anchor="middle">Customer</text>
<rect x="70" y="296" width="250" height="62" rx="8" fill="#FFFFFF" stroke="#2F6FB0" stroke-width="2"/>
<text x="195.0" y="331.9" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2F6FB0" text-anchor="middle">Location · pincode</text>
<rect x="70" y="378" width="250" height="62" rx="8" fill="#FFFFFF" stroke="#2F6FB0" stroke-width="2"/>
<text x="195.0" y="413.9" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2F6FB0" text-anchor="middle">Service + package</text>
<rect x="70" y="460" width="250" height="62" rx="8" fill="#FFFFFF" stroke="#2F6FB0" stroke-width="2"/>
<text x="195.0" y="495.9" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2F6FB0" text-anchor="middle">Address + time slot</text>
<text x="70" y="556" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="10" font-weight="400" fill="#5B6B65" text-anchor="start">The customer never chooses a worker.</text>
<text x="70" y="574" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="10" font-weight="400" fill="#5B6B65" text-anchor="start">18 packages across 8 services.</text>
<path d="M 320 491 H 372" fill="none" stroke="#2F6FB0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="392" y="200" width="268" height="322" rx="12" fill="#E1F0EB" stroke="#0F6B5C" stroke-width="3"/>
<text x="526.0" y="254" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0A4F44" text-anchor="middle">Cooperative</text>
<text x="526.0" y="282" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0A4F44" text-anchor="middle">dispatch</text>
<line x1="432" y1="304" x2="620" y2="304" stroke="#0F6B5C" stroke-width="1.5" stroke-linecap="round" opacity=".35"/>
<text x="418" y="338" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A4F44" text-anchor="start">Verified</text>
<text x="418" y="355" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="10" font-weight="400" fill="#5B6B65" text-anchor="start">only federation-approved workers</text>
<text x="418" y="384" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A4F44" text-anchor="start">Skilled</text>
<text x="418" y="401" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="10" font-weight="400" fill="#5B6B65" text-anchor="start">service category must match</text>
<text x="418" y="430" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A4F44" text-anchor="start">Local</text>
<text x="418" y="447" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="10" font-weight="400" fill="#5B6B65" text-anchor="start">same pincode, or within 25 km</text>
<text x="418" y="476" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A4F44" text-anchor="start">Available</text>
<text x="418" y="493" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="10" font-weight="400" fill="#5B6B65" text-anchor="start">free to start right now</text>
<text x="392" y="556" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="10" font-weight="400" fill="#5B6B65" text-anchor="start">Eligibility is a pure per-worker rule,</text>
<text x="392" y="574" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="10" font-weight="400" fill="#5B6B65" text-anchor="start">so every channel agrees by construction.</text>
