<text x="1300" y="614" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#9E3B32" text-anchor="middle" letter-spacing="1.3">NO LONGER AVAILABLE</text>
<path d="M 1300 488 V 534" fill="none" stroke="#9E3B32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" opacity=".45"/>
<text x="70" y="672" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#16211E" text-anchor="start">Why exactly one survives</text>
<text x="70" y="698" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6B65" text-anchor="start">Under READ COMMITTED a second UPDATE waits for the first to commit, then re-evaluates its WHERE clause against the committed row — and no longer matches.</text>
<text x="70" y="724" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="10" font-weight="400" fill="#5B6B65" text-anchor="start">Verified at 2, 5, 10 and 20 concurrent accepts, asserted against the database rather than the API response.  scripts/v3-verify.py §7</text>
