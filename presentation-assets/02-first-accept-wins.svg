<text x="800.0" y="440" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="13" font-weight="500" fill="#5B6B65" text-anchor="middle">UPDATE Worker  SET availability='BUSY'  WHERE availability='AVAILABLE'</text>
<text x="800.0" y="464" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="13" font-weight="500" fill="#5B6B65" text-anchor="middle">UPDATE Booking SET workerId=…  WHERE status='REQUESTED' AND workerId IS NULL</text>
